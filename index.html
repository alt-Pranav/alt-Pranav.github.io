<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pranav Bhagwat</title>
  <meta name="description" content="Pranav Bhagwat, ML and software engineer working on computer vision, LLM systems, and production infrastructure.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='6' fill='none' stroke='%23E3A008' stroke-width='6'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%232447D6'%3EPB%3C/text%3E%3C/svg%3E">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">

  <!-- Apply saved theme before paint (prevents flash) -->
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>

  <style>
    /* ================= 1. THEME TOKENS (edit colors/fonts here) ================= */
    :root {
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --text: #16203A;
      --muted: #566079;
      --line: #DCE1EA;
      --accent: #2447D6;      /* links, buttons */
      --box: #E3A008;         /* bounding-box motif */
      --box-ink: #16203A;     /* text on --box */
      --banner-a: #1B2E6B;    /* banner fallback gradient */
      --banner-b: #2447D6;
      --radius-s: 4px;
      --radius-l: 14px;
      --max: 760px;           /* content width */
      --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    /* Dark palette: system preference */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1424; --surface: #151D31; --text: #E4E9F3; --muted: #9AA5BD; --line: #26304A;
        --accent: #8FA6FF; --box: #F2B53A; --box-ink: #0E1424; --banner-a: #0A1330; --banner-b: #1E3290;
      }
    }
    /* Dark palette: manual toggle */
    :root[data-theme="dark"] {
      --bg: #0E1424; --surface: #151D31; --text: #E4E9F3; --muted: #9AA5BD; --line: #26304A;
      --accent: #8FA6FF; --box: #F2B53A; --box-ink: #0E1424; --banner-a: #0A1330; --banner-b: #1E3290;
    }

    /* ================= 2. BASE ================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 1.0625rem; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: var(--accent); text-underline-offset: 0.2em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 1.25rem; }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 1rem; top: 0.75rem; z-index: 100; background: var(--surface); padding: 0.5rem 0.75rem; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ================= 3. TOP BAR (nav + theme toggle) ================= */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .wrap { display: flex; align-items: center; gap: 1.25rem; height: 3.5rem; }
    .brand { font-weight: 800; color: var(--text); text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
    .nav { display: flex; gap: 1.1rem; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; white-space: nowrap; padding: 0.3rem 0; }
    .nav a:hover, .nav a.active { color: var(--text); }
    .nav a.active { box-shadow: inset 0 -2px 0 var(--box); }
    .icon-btn {
      flex: none; display: grid; place-items: center; width: 2.25rem; height: 2.25rem;
      border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--text); cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--text); }
    @media (max-width: 600px) { .brand { display: none; } }

    /* ================= 4. HERO (banner, photo, name) ================= */
    .banner {
      height: clamp(150px, 28vw, 280px);
      background-image:
        var(--banner-img, none),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 48px),
        linear-gradient(135deg, var(--banner-a), var(--banner-b));
      background-size: cover, auto, auto, auto;
      background-position: center;
    }
    .avatar {
      position: relative; width: 124px; height: 124px; margin-top: -62px;
      border-radius: 50%; border: 4px solid var(--bg); background: var(--surface); overflow: hidden;
      display: grid; place-items: center; font-size: 2.1rem; font-weight: 800; color: var(--accent);
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .name {
      font-size: clamp(2.5rem, 8vw, 4.25rem); font-weight: 800; line-height: 1.05;
      letter-spacing: -0.03em; margin: 2.4rem 0 1rem;
    }
    /* Bounding box around the name; label comes from data-label */
    .bbox { position: relative; display: inline-block; padding: 0.04em 0.16em; }
    .bbox::before {
      content: ""; position: absolute; inset: 0; border: 2px solid var(--box); border-radius: 2px;
      animation: lock 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
    }
    .bbox[data-label]:not([data-label=""])::after {
      content: attr(data-label); position: absolute; left: 0; bottom: 100%;
      background: var(--box); color: var(--box-ink); font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0; line-height: 1; padding: 0.32em 0.45em; border-radius: 2px 2px 0 0;
      animation: fade 0.3s ease 0.8s both;
    }
    @keyframes lock { from { transform: scale(1.12); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .tagline { font-size: clamp(1.15rem, 2.6vw, 1.4rem); font-weight: 500; line-height: 1.35; max-width: 36ch; margin: 0 0 0.75rem; }
    .status { color: var(--muted); margin: 0 0 1.5rem; }

    /* ================= 5. BUTTONS ================= */
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.55rem 1rem;
      border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
      color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.95rem;
    }
    .btn:hover { border-color: var(--text); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn.primary:hover { filter: brightness(1.08); }

    /* ================= 6. SECTION SHELL (shared by all sections) ================= */
    .section { padding-top: 4rem; }
    .section-title {
      display: flex; align-items: center; gap: 0.6rem;
      font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 1.5rem;
    }
    .section-title::before { content: ""; width: 0.65em; height: 0.65em; border: 2px solid var(--box); border-radius: 2px; }
    .prose p { max-width: 65ch; margin: 0 0 1rem; }

    /* Shared entry header (experience, projects, education) */
    .entry-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.2rem 1rem; }
    .entry-title { font-size: 1.15rem; font-weight: 700; margin: 0; line-height: 1.35; }
    .entry-date { color: var(--muted); font-size: 0.9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .entry-sub { color: var(--muted); margin: 0.15rem 0 0.6rem; }
    .bullets { margin: 0; padding-left: 1.1rem; }
    .bullets li { margin: 0.35rem 0; max-width: 68ch; }
    .bullets li::marker { color: var(--muted); }

    /* ================= 7. EXPERIENCE (timeline) ================= */
    .timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
    .job { position: relative; padding: 0 0 2.25rem 1.5rem; }
    .job:last-child { padding-bottom: 0.25rem; }
    .job::before {
      content: ""; position: absolute; left: -7px; top: 0.5rem; width: 12px; height: 12px;
      border-radius: 50%; background: var(--bg); border: 2px solid var(--accent);
    }

    /* ================= 8. PROJECTS ================= */
    .projects { display: grid; gap: 1.25rem; }
    .project { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 1.4rem 1.5rem; }
    .badge {
      display: inline-block; margin-left: 0.5rem; vertical-align: 0.15em;
      background: var(--box); color: var(--box-ink); font-size: 0.78rem; font-weight: 700;
      padding: 0.15rem 0.5rem; border-radius: var(--radius-s);
    }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; list-style: none; padding: 0; margin: 0.6rem 0 0.8rem; }
    .tag { font-size: 0.82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.6rem; }
    .project-links { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-top: 0.9rem; font-weight: 600; }

    /* ================= 9. SKILLS ================= */
    .skills { display: grid; grid-template-columns: minmax(8rem, 11rem) 1fr; gap: 0.9rem 1.5rem; margin: 0; }
    .skills dt { font-weight: 700; }
    .skills dd { margin: 0; color: var(--muted); }
    @media (max-width: 560px) {
      .skills { grid-template-columns: 1fr; gap: 0.15rem; }
      .skills dd { margin-bottom: 0.9rem; }
    }

    /* ================= 10. EDUCATION ================= */
    .edu { margin-bottom: 1.75rem; }
    .edu:last-child { margin-bottom: 0; }

    /* ================= 11. FOOTER ================= */
    .footer { padding: 4rem 0 2.5rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- ===== TOP BAR (links auto-built from SECTIONS in JS) ===== -->
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#top" id="brand"></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <button class="icon-btn" id="theme-toggle" type="button"></button>
    </div>
  </header>

  <!-- ===== HERO (content set from PROFILE in JS) ===== -->
  <div id="top">
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="wrap">
      <div class="avatar" id="avatar"></div>
      <h1 class="name"><span class="bbox" id="name"></span></h1>
      <p class="tagline" id="tagline"></p>
      <p class="status" id="status"></p>
      <div class="actions" id="hero-actions"></div>
    </div>
  </div>

  <!-- ===== SECTIONS (rendered from SECTIONS in JS) ===== -->
  <main class="wrap" id="main"></main>
  <noscript><p class="wrap">This site needs JavaScript to display its content.</p></noscript>

  <!-- ===== FOOTER ===== -->
  <footer class="footer"><div class="wrap" id="footer"></div></footer>

  <script>
    /* ================= A. PROFILE (hero, links, files) =================
       Put profile.jpg, banner.jpg, resume.pdf in the repo root.
       Missing photo shows initials; missing banner shows a gradient. */
    const PROFILE = {
      name: "Pranav Bhagwat",
      initials: "PB",
      bboxLabel: "person 0.99",   // tag above your name; "" hides it
      tagline: "ML and software engineer. Computer vision, LLM systems, and the infrastructure that runs them.",
      status: "MS in Computer Science at NC State, graduating May 2027. Open to full-time roles.",
      photo: "profile.jpg",
      banner: "banner.jpg",
      resume: "resume.pdf",
      email: "pranav221b@gmail.com",
      linkedin: "https://www.linkedin.com/in/pranav-bhagwat-pb",
      github: "https://github.com/alt-Pranav",
    };

    /* ================= B. SECTIONS =================
       Each section: id (URL anchor), title (nav + heading), data, render().
       Strings may contain simple HTML like <strong>. */

    /* ----- B1. ABOUT ----- */
    const ABOUT = {
      id: "about",
      title: "About",
      paragraphs: [
        "I build machine learning systems end to end, from training vision and language models to shipping them as production services.",
        "As lead software engineer at Thelios.ai, I owned a computer vision pipeline on AWS that analyzed over 100 hours of sports footage a week. Now I'm finishing an MS in Computer Science at NC State, teaching in its Generative AI course, and building with LLMs, graph retrieval, and agent tooling.",
      ],
      render() {
        return `<div class="prose">${this.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>`;
      },
    };

    /* ----- B2. EXPERIENCE (newest first) ----- */
    const EXPERIENCE = {
      id: "experience",
      title: "Experience",
      items: [
        {
          role: "Graduate Teaching Assistant, Generative AI",
          org: "North Carolina State University",
          dates: "Jan 2026 – May 2026",
          bullets: [
            "Built and tested end-to-end Python assignments in PyTorch and HuggingFace, with starter scaffolding, reference solutions, and automated test harnesses for deterministic, reproducible grading.",
            "Packaged reproducible GPU environments (dependency pinning, Colab and cluster setup) and debugged student issues across CUDA errors, dependency conflicts, and OOM failures.",
            "Wrote technical documentation and specs that turned research-level material into clear, incrementally testable engineering tasks.",
          ],
        },
        {
          role: "Lead Software Engineer",
          org: "Thelios.ai (Sportsseam LLC)",
          dates: "Aug 2023 – Aug 2025",
          bullets: [
            // TODO: swap "accuracy" for the real metric (mAP / F1) if that's what you measured
            "Architected and owned a production computer vision microservice on AWS (EC2, ECS, ECR) processing <strong>100+ hours of footage weekly</strong>, from model training through deployment and monitoring. Reached 95% accuracy in player detection and <strong>cut manual analysis time by 80%</strong>.",
            "Engineered temporal action localization models with CNNs, Vision Transformers, and vision-language models in PyTorch, reaching 85% accuracy on complex player behaviors.",
            "Implemented custom graph-based heuristic algorithms for team analysis.",
            "Expanded coverage across multimodal understanding, detection, segmentation, tracking, and pose estimation, increasing the player behaviors analyzed per play.",
          ],
        },
        {
          role: "Software Development Intern",
          org: "BMC Software",
          dates: "Jan 2022 – Jun 2022",
          bullets: [
            "Built a Git-tracked pipeline: NLP feature extraction (NLTK), an ML anomaly classifier (scikit-learn), and iterative evaluation, reaching <strong>86% accuracy</strong> on enterprise network config data.",
            "Led a 4-intern team through the full SDLC over a 4-month project: requirements, implementation, testing, and evaluation.",
          ],
        },
      ],
      render() {
        return `<ol class="timeline">${this.items.map(j => `
          <li class="job">
            <div class="entry-head">
              <h3 class="entry-title">${j.role}</h3>
              <span class="entry-date">${j.dates}</span>
            </div>
            <p class="entry-sub">${j.org}</p>
            <ul class="bullets">${j.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          </li>`).join("")}</ol>`;
      },
    };

    /* ----- B3. PROJECTS (links with empty url are hidden) ----- */
    const PROJECTS = {
      id: "projects",
      title: "Projects",
      items: [
        {
          name: "OmniView: Instagram event GraphRAG",
          dates: "Jul 2026 – present",
          badge: "",
          tags: ["Neo4j", "GraphRAG", "Python", "Whisper", "Groq", "Streamlit"],
          bullets: [
            "End-to-end GraphRAG pipeline that scrapes Instagram posts and Reels, transcribes audio with Whisper, and upserts structured entities into a Neo4j Aura knowledge graph.",
            "Hybrid retrieval that combines vector search over sentence-transformer embeddings with local graph traversal to surface conflicting claims across sources in a single query.",
            "Multi-perspective LLM synthesis that flags narrative gaps, opposing accounts, and source uncertainty, with inline citations linking every claim to its source post.",
          ],
          links: [
            { label: "Code", url: "" },
            { label: "Demo", url: "" },
          ],
        },
        {
          name: "Sentinel AI",
          dates: "Mar 2026",
          badge: "SolHacks 2026 winner",
          tags: ["Python", "TypeScript", "FastAPI", "Gemini", "Solana"],
          bullets: [
            "VS Code extension that intercepts GitHub Copilot agent file actions after inference and checks them against user-defined compliance policies before any code runs, aimed at healthcare and fintech.",
            "FastAPI verifier with a hybrid policy engine (regex plus Gemini 2.5 Flash), hot-reloadable Markdown policies, and deterministic, traceable risk verdicts with human-in-the-loop decisions.",
            "Every governance decision logged immutably on Solana via the SPL Memo Program, with a Chart.js dashboard for audit trails.",
          ],
          links: [
            { label: "Code", url: "" },
            { label: "Devpost", url: "" },
          ],
        },
      ],
      render() {
        return `<div class="projects">${this.items.map(p => {
          const links = p.links.filter(l => l.url)
            .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join("");
          return `
          <article class="project">
            <div class="entry-head">
              <h3 class="entry-title">${p.name}${p.badge ? `<span class="badge">${p.badge}</span>` : ""}</h3>
              <span class="entry-date">${p.dates}</span>
            </div>
            <ul class="tags">${p.tags.map(t => `<li class="tag">${t}</li>`).join("")}</ul>
            <ul class="bullets">${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
            ${links ? `<div class="project-links">${links}</div>` : ""}
          </article>`;
        }).join("")}</div>`;
      },
    };

    /* ----- B4. SKILLS ----- */
    const SKILLS = {
      id: "skills",
      title: "Skills",
      groups: [
        { group: "Languages", items: ["Python", "C++", "Java", "SQL", "Bash", "Dart"] },
        { group: "ML and vision", items: ["PyTorch", "TensorFlow", "HuggingFace Transformers", "MMAction", "OpenCV", "Weights & Biases", "Matplotlib"] },
        { group: "LLMs and agents", items: ["LLM applications", "RAG and GraphRAG", "Coding agents", "Gemini", "Groq"] },
        { group: "Systems", items: ["Distributed systems", "Microservices", "REST APIs", "OOP design patterns", "ROS 2"] },
        { group: "Cloud and DevOps", items: ["AWS (EC2, ECS, ECR)", "Docker", "Apache Airflow", "Git", "GitHub Actions", "CI/CD"] },
        { group: "Data", items: ["MongoDB", "Neo4j"] },
        { group: "Web and other", items: ["Flutter", "Flask", "FastAPI", "Streamlit", "LaTeX"] },
      ],
      render() {
        return `<dl class="skills">${this.groups.map(g => `<dt>${g.group}</dt><dd>${g.items.join(", ")}</dd>`).join("")}</dl>`;
      },
    };

    /* ----- B5. EDUCATION ----- */
    const EDUCATION = {
      id: "education",
      title: "Education",
      items: [
        {
          degree: "MS in Computer Science",
          school: "North Carolina State University, Raleigh, NC",
          dates: "Aug 2025 – May 2027",
          detail: "GPA 4.0. Coursework: Software Engineering, Operating Systems, Parallel Systems.",
        },
        {
          degree: "BE in Information Technology",
          school: "Pune Institute of Computer Technology, India",
          dates: "Jul 2019 – Jun 2023",
          detail: "CGPA 9.31/10. Coursework: DSA, OOP, Networks, OS, AI, ML, Computer Vision, Databases, Discrete Math.",
        },
      ],
      render() {
        return this.items.map(e => `
          <div class="edu">
            <div class="entry-head">
              <h3 class="entry-title">${e.degree}</h3>
              <span class="entry-date">${e.dates}</span>
            </div>
            <p class="entry-sub">${e.school}</p>
            <p>${e.detail}</p>
          </div>`).join("");
      },
    };

    /* ----- B6. CONTACT ----- */
    const CONTACT = {
      id: "contact",
      title: "Contact",
      text: "Email is the fastest way to reach me. I usually reply within a day.",
      render() {
        return `<div class="prose"><p>${this.text}</p></div><div class="actions">${contactButtons(false)}</div>`;
      },
    };

    /* ================= C. SECTION ORDER =================
       Reorder, remove, or add sections here. Nav updates automatically. */
    const SECTIONS = [ABOUT, EXPERIENCE, PROJECTS, SKILLS, EDUCATION, CONTACT];

    /* ================= D. RENDERING (no edits needed below) ================= */
    const $ = id => document.getElementById(id);
    const ICON = {
      download: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>`,
      sun: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
      moon: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`,
    };

    // Resume + email + LinkedIn + GitHub buttons; skips empty fields
    function contactButtons(withResume) {
      const P = PROFILE, out = [];
      if (withResume && P.resume) out.push(`<a class="btn primary" href="${P.resume}" download>${ICON.download}Download resume</a>`);
      if (P.email) out.push(`<a class="btn" href="mailto:${P.email}">Email</a>`);
      if (P.linkedin) out.push(`<a class="btn" href="${P.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`);
      if (P.github) out.push(`<a class="btn" href="${P.github}" target="_blank" rel="noopener">GitHub</a>`);
      return out.join("");
    }

    // Hero
    function renderHero() {
      const P = PROFILE;
      $("brand").textContent = P.name;
      $("name").textContent = P.name;
      $("name").dataset.label = P.bboxLabel;
      $("tagline").innerHTML = P.tagline;
      $("status").innerHTML = P.status;
      $("hero-actions").innerHTML = contactButtons(true);
      if (P.banner) $("banner").style.setProperty("--banner-img", `url("${P.banner}")`);
      $("avatar").innerHTML = `<span>${P.initials}</span>` +
        (P.photo ? `<img src="${P.photo}" alt="${P.name}" onerror="this.remove()">` : "");
    }

    // Sections + nav
    function renderSections() {
      $("main").innerHTML = SECTIONS.map(s => `
        <section class="section" id="${s.id}" aria-labelledby="${s.id}-h">
          <h2 class="section-title" id="${s.id}-h">${s.title}</h2>
          ${s.render()}
        </section>`).join("");
      $("nav").innerHTML = SECTIONS.map(s => `<a href="#${s.id}">${s.title}</a>`).join("");
    }

    // Highlight nav link for the section in view
    function initScrollSpy() {
      const links = [...$("nav").querySelectorAll("a")];
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          links.forEach(a => a.classList.toggle("active", a.hash === "#" + e.target.id));
        });
      }, { rootMargin: "-40% 0px -55% 0px" });
      SECTIONS.forEach(s => obs.observe($(s.id)));
    }

    // Light/dark toggle; remembers choice
    function initTheme() {
      const btn = $("theme-toggle");
      const dark = () => (document.documentElement.dataset.theme ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
      const paint = () => {
        btn.innerHTML = dark() ? ICON.sun : ICON.moon;
        btn.setAttribute("aria-label", dark() ? "Switch to light mode" : "Switch to dark mode");
      };
      btn.addEventListener("click", () => {
        const next = dark() ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        paint();
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
      paint();
    }

    // Footer
    function renderFooter() {
      $("footer").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;
    }

    renderHero();
    renderSections();
    renderFooter();
    initTheme();
    initScrollSpy();
  </script>
</body>
</html>
